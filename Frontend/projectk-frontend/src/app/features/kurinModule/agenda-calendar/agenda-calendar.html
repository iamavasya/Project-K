<div class="agenda-page">
  <section class="kurin-tile">
    <div class="agenda-header">
      <h1 class="agenda-title">Календар</h1>
      @if (canManage()) {
        <p-button label="Нова подія" icon="pi pi-plus" (click)="openCreate()" />
      }
    </div>

    <full-calendar [options]="calendarOptions()" />
  </section>
</div>

<!-- Only leadership creates/edits; rendering the dialog (which eagerly loads the mentor-only
     assign-targets) for plain users would 403 and bounce them to /forbidden. -->
@if (canManage()) {
  <app-agenda-item-dialog
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [kurinKey]="kurinKey()"
    [item]="editing()"
    [defaultKind]="'Event'"
    [presetStart]="presetStart()"
    [presetEnd]="presetEnd()"
    [presetAllDay]="presetAllDay()"
    (saved)="onSaved()" />
}
