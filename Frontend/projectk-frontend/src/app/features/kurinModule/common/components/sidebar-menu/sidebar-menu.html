<p-drawer [visible]="visible" (onHide)="close()" closable="true">
    <ng-template #headless>
        <div class="lil-sidebar-brand">
            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M50 92 V46" />
                <path d="M50 46 C28 44 18 30 26 18 C36 8 48 24 50 46 Z" />
                <path d="M50 46 C72 44 82 30 74 18 C64 8 52 24 50 46 Z" />
                <path class="lil-mark-center" d="M50 46 C42 30 44 16 50 8 C56 16 58 30 50 46 Z" />
            </svg>
            <h2 class="lil-wordmark">Лілейка</h2>
        </div>

        <div class="sidebar-content">
            <p-panelmenu [model]="(items$ | async) ?? []" styleClass="lil-menu"></p-panelmenu>
        </div>

        <div class="sidebar-version">{{ versionLabel }}</div>

        <div class="sidebar-footer">
            <span class="pi pi-user" aria-hidden="true"></span>
            <span class="sidebar-footer__email">{{ (email$ | async) ?? 'Error' }}</span>
            <p-tag [severity]="$any(getSeverityOnRole(role$ | async))" [value]="(role$ | async) ?? 'Error'"></p-tag>
        </div>
    </ng-template>
</p-drawer>
