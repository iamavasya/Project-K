@if (value(); as v) {
  <div class="card-sharing">
    <div class="card-sharing__switch">
      <p-toggleswitch [ngModel]="v.minorsMayShare" (ngModelChange)="setShare($event)" inputId="minors-may-share" />
      <label for="minors-may-share">Дозволити юнакам до 18 показувати картку</label>
    </div>

    @if (v.minorsMayShare) {
      <fieldset class="card-sharing__fields">
        <legend>Що вони можуть показати</legend>
        @for (field of fieldList; track field.name) {
          <div class="card-sharing__field">
            <p-checkbox [binary]="true" [ngModel]="has(field.name)" (ngModelChange)="setField(field.name, $event)"
              [inputId]="'minor-' + field.name" />
            <label [for]="'minor-' + field.name">{{ field.label }}</label>
          </div>
        }
      </fieldset>

      <div class="card-sharing__switch">
        <p-toggleswitch [ngModel]="v.minorsMayLink" (ngModelChange)="setLink($event)" inputId="minors-may-link" />
        <label for="minors-may-link">
          Також постійне посилання
          <small>Без нього картку можна лише показати для перевірки, QR діє три хвилини.</small>
        </label>
      </div>
    }
  </div>
}
