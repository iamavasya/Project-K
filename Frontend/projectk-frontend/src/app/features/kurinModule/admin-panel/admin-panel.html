<div class="admin-panel">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">Адміністрація</h2>
        <div class="flex gap-2">
            <p-button label="Оголошення" icon="pi pi-megaphone" severity="secondary" [routerLink]="['/announcements']" />
            <p-button label="Заявки" icon="pi pi-list" severity="secondary" [routerLink]="['/waitlist']" />
            <p-button label="Користувачі" icon="pi pi-users" severity="secondary" [routerLink]="['/users']" />
        </div>
    </div>
    <p-table [value]="data" styleClass="project-table">
        <ng-template #caption>
            <div class="table-caption">
                <div>
                    <h3>Курені</h3>
                    <p>{{ data.length }} у системі</p>
                </div>
                @if (data.length > 0) {
                    <p-button (onClick)="onActionClick(null, 'create')" label="Створити курінь" icon="pi pi-plus" />
                }
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th scope="col">Курінь</th>
                <th scope="col" class="admin-kurin-actions">Дії</th>
            </tr>
        </ng-template>
        <ng-template #body let-item>
            <tr class="admin-kurin-row">
                <td data-mobile-label="Курінь">
                    <div class="kurin-number-cell">
                        <span>{{ item.number }}</span>
                        <small>число куреня</small>
                    </div>
                </td>
                <td class="admin-kurin-actions" data-mobile-label="Дії">
                    <p-splitButton label="Відкрити" icon="pi pi-arrow-right" (onClick)="onOpenClick(item.kurinKey)" [model]="actions" (onDropdownClick)="prepareItemActions(item)" />
                </td>
            </tr>
        </ng-template>
    </p-table>
    @if (data.length === 0) {
        <div class="admin-panel__empty">
            <app-empty-state
                art="list"
                title="Куренів ще немає"
                body="Створи перший — і система оживе.">
                <p-button (onClick)="onActionClick(null, 'create')" label="Створити курінь" icon="pi pi-plus" />
            </app-empty-state>
        </div>
    }
</div>
<app-manage-panel [(visible)]="managePanelVisible"
  [parameter]="managePanelParameter"
  [entity]="selectedItem"
  [config]="managePanelConfig"
  (actionPerformed)="onManageAction($event)"
 />
