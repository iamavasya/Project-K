server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser-side hardening for the SPA. No Content-Security-Policy yet: the theme injects inline
    # styles and photos come from a blob host that differs per deployment, so a strict policy has
    # to be worked out per install (tracked as SEC-4.2). These four are safe everywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ready";
    }

    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files /env.js =404;
    }

    # The SPA shell and the non-content-hashed entry bundles must always revalidate, otherwise a
    # redeploy is not picked up until the browser cache expires (they keep stable names, so a stale
    # copy would pin the whole app — including which hashed lazy chunks get loaded). Content-hashed
    # chunks keep their default long-lived caching.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* ^/(main|polyfills|runtime|scripts|styles)\.js$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The self-host bundle publishes this port and nothing else: the API and the blob store are
    # reached through here, so the API only ever sees nginx and takes the visitor's address from
    # X-Real-IP (Security:ClientIp:Header), which no browser can write past this proxy. The
    # upstream names are resolved per request rather than when nginx starts, so the same image
    # still comes up in the dev composes, where the browser talks to the API directly and these
    # locations are never hit.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $projectk_api http://projectk-api:8080;
        proxy_pass $projectk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Photo and silhouette uploads; the API refuses anything past 6 MB on its own.
        client_max_body_size 8m;
    }

    location /badges_images/ {
        set $projectk_api http://projectk-api:8080;
        proxy_pass $projectk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Photos are public blobs read straight by the browser. Azurite is not published on the host,
    # so BlobStorage:PublicBaseUrl points here and the prefix is dropped on the way through.
    location /blob/ {
        set $projectk_blob http://projectk-azurite:10000;
        rewrite ^/blob/(.*)$ /$1 break;
        proxy_pass $projectk_blob;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
