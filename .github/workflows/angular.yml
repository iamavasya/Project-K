name: Frontend CI/CD

on:
  # Every branch is linted, tested and built. PRs stay wired up only for the Azure SWA
  # preview environments, not as a review gate.
  push:
    branches: [ "**" ]
    paths:
      - 'Frontend/**'
      # A change to the pipeline is a change that has to run through it.
      - '.github/workflows/angular.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ "main", "dev" ]
    paths:
      - 'Frontend/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  lint_and_test:
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Lint and Test
    steps:
      - uses: actions/checkout@v7

      # Kept identical in dotnet.yml and selfhost-docker.yml; change one, change all three.
      - name: Extract Release Info
        if: github.event_name == 'release'
        shell: bash
        env:
          # Through the environment, not ${{ }} inside the script: a release name is free text and
          # would otherwise be pasted into the shell as code.
          RAW_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          VERSION="${RAW_TAG#v}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '$RAW_TAG' is not a version like v1.0, v1.0.0 or v1.0.0-beta"
            exit 1
          fi
          # The code name is whatever the release name carries in quotes, and a release no longer
          # has to carry one: with no quotes this stays empty, and everything that prints a release
          # drops the quotes along with it.
          CODE_NAME=$(printf '%s' "$RELEASE_NAME" | sed -n 's/.*"\([^"]*\)".*/\1/p')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CODENAME=$CODE_NAME" >> $GITHUB_ENV

      - name: Extract Dev Info
        if: github.event_name != 'release'
        shell: bash
        run: |
          echo "VERSION=0.0.0-dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "CODENAME=StagingBuild" >> $GITHUB_ENV

      - name: Inject Versioning to Angular
        shell: bash
        run: |
          : "${VERSION:?no version resolved by an earlier step}"
          ENV_FILES=$(find Frontend/projectk-frontend/src/environments/ -name "environment*.ts")
          for file in $ENV_FILES; do
            sed -i "s/v0.0.0-dev/${VERSION}/g" "$file"
            # CODENAME is empty for a release without a code name, which blanks the placeholder.
            sed -i "s/LocalDevelopment/${CODENAME}/g" "$file"
          done

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: Frontend/projectk-frontend/package-lock.json

      - run: npm ci
        working-directory: Frontend/projectk-frontend

      # Lint is a real gate again: sonarjs findings are warnings, so only genuine errors fail.
      - name: Run lint
        run: npm run lint
        working-directory: Frontend/projectk-frontend

      - name: Test
        run: npm run test-c -- --watch=false --browsers=ChromeHeadless
        working-directory: Frontend/projectk-frontend

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/projectk-frontend/coverage/
          if-no-files-found: warn

      - name: Notify dev Telegram on frontend failure
        if: failure()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_ALERTS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_DEV_ALERTS_CHAT_ID }}
          TELEGRAM_TEXT: |
            [ProjectK] Frontend workflow failed
            Workflow: ${{ github.workflow }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/send-telegram-message.sh

  build_and_deploy:
    needs: lint_and_test
    # The push trigger now covers every branch, so deployment is pinned to the long-lived ones.
    # PR builds still deploy, because that is how SWA preview environments are produced.
    if: >-
      github.event_name == 'release'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.action != 'closed')
      || (github.event_name == 'push'
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    name: Build and Deploy to Azure SWA
    environment:
      name: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
          
      - name: Inject Versioning
        shell: bash
        env:
          RAW_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            # The same spelling the API reports and the image tags carry: the tag without its "v".
            # This step used to keep the "v", so the About page showed the app as v0.20.0-beta and
            # the API it was talking to as 0.20.0-beta — one release under two names.
            TAG_NAME="${RAW_TAG#v}"
            if ! printf '%s' "$TAG_NAME" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?([-.][0-9A-Za-z.-]+)?$'; then
              echo "::error::Release tag '$RAW_TAG' is not a version like v1.0, v1.0.0 or v1.0.0-beta"
              exit 1
            fi
            # Empty when the release name carries no quoted code name. It used to invent one.
            CODE_NAME=$(printf '%s' "$RELEASE_NAME" | sed -n 's/.*"\([^"]*\)".*/\1/p')
          else
            TAG_NAME="0.0.0-dev-${GITHUB_SHA::7}"
            CODE_NAME="StagingBuild"
          fi

          ENV_FILES=$(find Frontend/projectk-frontend/src/environments/ -name "environment*.ts")
          for file in $ENV_FILES; do
            sed -i "s/v0.0.0-dev/$TAG_NAME/g" "$file"
            sed -i "s/LocalDevelopment/$CODE_NAME/g" "$file"
          done

      # Built here rather than by the deploy action. Azure's Oryx image pins Node 22.22.0 and the
      # Angular 22 CLI refuses anything below 22.22.3, so letting SWA build fails before it starts.
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: Frontend/projectk-frontend/package-lock.json

      - run: npm ci
        working-directory: Frontend/projectk-frontend

      - name: Build
        run: npm run build -- --configuration ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'production' || 'staging' }}
        working-directory: Frontend/projectk-frontend

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "Frontend/projectk-frontend/dist/projectk-frontend/browser"
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Notify dev Telegram on frontend deploy failure
        if: failure()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_ALERTS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_DEV_ALERTS_CHAT_ID }}
          TELEGRAM_TEXT: |
            [ProjectK] Frontend deploy failed
            Environment: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'production' || 'staging' }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/send-telegram-message.sh

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    environment:
      name: ${{ github.base_ref == 'main' && 'production' || 'staging' }}
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
