name: Backend CI/CD

on:
  # Every branch gets built, tested and analysed. Pull requests are not a gate here: the project has
  # a single maintainer who reviews their own PRs, so waiting for one adds nothing.
  push:
    branches: [ "**" ]
    paths:
      - 'Backend/**'
      # A change to the pipeline is a change that has to run through it.
      - '.github/workflows/dotnet.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Extract Release Info
      if: github.event_name == 'release'
      shell: bash
      run: |
        RAW_TAG="${{ github.event.release.tag_name }}"
        CLEAN_VERSION="${RAW_TAG#v}"
        RELEASE_NAME='${{ github.event.release.name }}'
        CODE_NAME=$(echo "$RELEASE_NAME" | grep -oP '"\K[^"]+' || echo "$RELEASE_NAME")
        echo "VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
        echo "CODENAME=$CODE_NAME" >> $GITHUB_ENV

    - name: Extract Dev Info
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      shell: bash
      run: |
        echo "VERSION=0.0.0-dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
        echo "CODENAME=StagingBuild" >> $GITHUB_ENV

    - name: Inject Versioning
      shell: bash
      run: |
        FILES=$(find Backend/ProjectK.Backend/ProjectK.API/ -name "appsettings*.json")
        echo "Updating files: $FILES"
        for file in $FILES; do
          sed -i "s/v0.0.0-dev/${{ env.VERSION }}/g" "$file"
          sed -i "s/LocalDevelopment/${{ env.CODENAME }}/g" "$file"
        done

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore Backend/ProjectK.Backend
      env: 
        NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
      
    - name: Build
      run: dotnet build Backend/ProjectK.Backend --configuration Release --no-restore 2>&1 | tee build.log

    # Advisory only. The analyzer backlog is tracked in docs/quality-baseline.md and driven down
    # deliberately; a red build on day one would just get ignored.
    - name: Report analyzer warnings
      if: always()
      continue-on-error: true
      shell: bash
      run: |
        grep -E ': warning ' build.log | sed -E 's/ \[[^]]*\]$//' | sort -u > warnings.txt || true
        TOTAL=$(wc -l < warnings.txt)
        {
          echo "## Analyzer warnings: $TOTAL"
          echo "_Baseline 652 — see docs/quality-baseline.md_"
          echo
          echo "| Project | Count |"
          echo "|---|---:|"
          grep -oE 'ProjectK\.Backend./[A-Za-z.]+' warnings.txt \
            | sed -E 's|.*ProjectK\.Backend./||' | sort | uniq -c | sort -rn \
            | awk '{printf "| %s | %s |\n", $2, $1}'
          echo
          echo "| Rule | Count |"
          echo "|---|---:|"
          grep -oE 'warning [A-Z]+[0-9]+' warnings.txt | sed 's/warning //' \
            | sort | uniq -c | sort -rn | head -15 \
            | awk '{printf "| %s | %s |\n", $2, $1}'
        } >> "$GITHUB_STEP_SUMMARY"

    # One project at a time. Handing the whole solution to `dotnet test` starts a VSTest task per
    # test project on separate MSBuild nodes, and when two start together one of them rejects its own
    # assembly ("The argument ...dll is invalid") and the run fails without a failing test. Serialised
    # like this the race cannot happen, and a failure names the project it came from.
    - name: Test
      shell: bash
      run: |
        for project in Backend/ProjectK.Backend/tests/*.Tests/*.csproj; do
          dotnet test "$project" --configuration Release --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" --results-directory TestResults
        done

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: TestResults/**/coverage.cobertura.xml
        if-no-files-found: warn

    - name: Notify dev Telegram on backend failure
      if: failure()
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_ALERTS_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_DEV_ALERTS_CHAT_ID }}
        TELEGRAM_TEXT: |
          [ProjectK] Backend workflow failed
          Workflow: ${{ github.workflow }}
          Ref: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash .github/scripts/send-telegram-message.sh

    - name: Publish Artifact
      run: dotnet publish Backend/ProjectK.Backend/ProjectK.API/ProjectK.API.csproj -c Release -o ./publish
      
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: dotnet-app
        path: ./publish/

  deploy:
    # Only the long-lived branches and releases deploy. The push trigger above now covers every
    # branch, so without this a feature branch would ship straight to staging.
    if: >-
      github.event_name == 'release'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: 
      name: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'production' || 'staging' }}
    
    steps:
    - uses: actions/checkout@v7

    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: dotnet-app

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .

    - name: Create public release announcement draft
      if: github.event_name == 'release'
      shell: bash
      env:
        PROJECTK_API_BASE_URL: ${{ vars.PROJECTK_API_BASE_URL }}
        PROJECTK_SERVICE_TOKEN: ${{ secrets.PROJECTK_SERVICE_TOKEN }}
        ANNOUNCEMENT_TITLE: ${{ github.event.release.name }}
        ANNOUNCEMENT_BODY: ${{ github.event.release.body }}
        ANNOUNCEMENT_SOURCE_ID: ${{ github.event.release.tag_name }}
        ANNOUNCEMENT_SOURCE_URL: ${{ github.event.release.html_url }}
        ANNOUNCEMENT_ENVIRONMENT: production
        ANNOUNCEMENT_VERSION: ${{ github.event.release.tag_name }}
      run: bash .github/scripts/create-public-announcement-draft.sh

    - name: Notify dev Telegram on backend deploy failure
      if: failure()
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_ALERTS_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_DEV_ALERTS_CHAT_ID }}
        TELEGRAM_TEXT: |
          [ProjectK] Backend deploy failed
          Environment: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'production' || 'staging' }}
          Ref: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash .github/scripts/send-telegram-message.sh
